name: learning_planet
description: 家庭小学生学习成长与游戏化激励 App
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  drift: ^2.35.3
  sqlite3: ^3.8.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.6.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  image_picker: ^1.2.1
  image: ^4.5.4
  google_mlkit_text_recognition: ^0.15.1
  printing: 5.14.2
  crypto: ^3.0.7
  file_picker: ^13.1.0
  archive: 4.0.9
  pinyin_pro_flutter: 1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
